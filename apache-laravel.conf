# Блок добавляется ниже VirtualHost основного каталога; пути заменить на фактическую папку проекта.
# Listen 8081 указывается один раз, если порт ещё не объявлен.
Listen 8081
<VirtualHost *:8081>
    ServerName localhost
    DocumentRoot "D:/PHPLabs/catalog-laravel/public"
    <Directory "D:/PHPLabs/catalog-laravel/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
